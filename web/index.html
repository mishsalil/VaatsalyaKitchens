<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f0f0f" />
    <meta name="description" content="Vaatsalya Kitchens — home-style food for parties, kitties and bulk orders, made with the warmth of home." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      SEO / social. The live domain is repeated here, in robots.txt and in
      sitemap.xml — change all three together if it ever moves. Absolute URLs
      are required: a social crawler and Google both resolve these without a
      page context, so a relative path is dropped.
    -->
    <link rel="canonical" href="https://vaatsalyakitchens.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vaatsalya Kitchens" />
    <meta property="og:title" content="Vaatsalya Kitchens — Home-style Food for Parties, Kitties &amp; Bulk Orders" />
    <meta property="og:description" content="Homestyle veg meals for small parties, kitty gatherings and bulk orders — so simple, anyone from 12 to 70+ can order in minutes." />
    <meta property="og:url" content="https://vaatsalyakitchens.in/" />
    <meta property="og:image" content="https://vaatsalyakitchens.in/branding/logo.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vaatsalya Kitchens — Home-style Food for Parties, Kitties &amp; Bulk Orders" />
    <meta name="twitter:description" content="Homestyle veg meals for small parties, kitty gatherings and bulk orders." />
    <meta name="twitter:image" content="https://vaatsalyakitchens.in/branding/logo.png" />

    <!--
      Structured data. Fill in the address, phone and hours to match the real
      business — Google shows these in search results, so a wrong value here is
      published to customers. Remove any property you cannot state truthfully.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Vaatsalya Kitchens",
        "description": "Home-style vegetarian food for parties, kitty gatherings and bulk orders.",
        "url": "https://vaatsalyakitchens.in/",
        "image": "https://vaatsalyakitchens.in/branding/logo.png",
        "servesCuisine": ["Indian", "Vegetarian"],
        "priceRange": "$$",
        "telephone": "+91-9623836382",
        "email": "vaatsalyakitchens@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "#001, Mishra Niwas, Sitapur SPN Highway, Badaura",
          "addressLocality": "Sitapur",
          "addressRegion": "Uttar Pradesh",
          "postalCode": "261001",
          "addressCountry": "IN"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vaatsalya Kitchens — Home-style Food for Parties, Kitties &amp; Bulk Orders</title>
  </head>
