<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Vaatsalya Kitchens logo: mandala above two elephants facing each other">
  <defs>
    <g id="petal">
      <path d="M0,-58 C10,-44 10,-30 0,-20 C-10,-30 -10,-44 0,-58 Z" fill="none" stroke="#8B4A4A" stroke-width="2.5"/>
      <path d="M0,-50 C5,-42 5,-32 0,-26 C-5,-32 -5,-42 0,-50 Z" fill="#8B4A4A" opacity="0.35"/>
    </g>
    <g id="elephant">
      <!-- body -->
      <path d="M30,150 C22,118 40,92 78,88 C112,84 138,98 142,124 C144,138 140,150 134,158 L134,182 L118,182 L118,164 C108,168 94,168 84,164 L84,182 L68,182 L68,160 C48,168 34,166 30,150 Z"
            fill="none" stroke="#8B4A4A" stroke-width="4" stroke-linejoin="round"/>
      <!-- trunk raised -->
      <path d="M140,120 C158,112 166,96 162,82 C160,74 168,70 174,74 C182,80 182,94 174,106 C164,122 152,130 142,132"
            fill="none" stroke="#8B4A4A" stroke-width="4" stroke-linecap="round"/>
      <!-- tusk -->
      <path d="M138,138 C148,140 156,146 158,154" fill="none" stroke="#8B4A4A" stroke-width="3.5" stroke-linecap="round"/>
      <!-- eye -->
      <ellipse cx="124" cy="118" rx="4.5" ry="3" fill="#8B4A4A"/>
      <!-- ear -->
      <path d="M96,100 C84,104 78,118 84,132 C92,144 108,144 114,134" fill="none" stroke="#8B4A4A" stroke-width="3.5"/>
      <!-- tail -->
      <path d="M32,140 C24,144 22,152 26,158" fill="none" stroke="#8B4A4A" stroke-width="3" stroke-linecap="round"/>
      <!-- blanket decoration -->
      <path d="M60,110 C74,102 96,100 110,106" fill="none" stroke="#8B4A4A" stroke-width="2.5"/>
      <path d="M56,124 C74,114 98,112 116,120" fill="none" stroke="#8B4A4A" stroke-width="2.5"/>
      <circle cx="86" cy="130" r="3" fill="#8B4A4A"/>
      <circle cx="70" cy="134" r="3" fill="#8B4A4A"/>
      <circle cx="102" cy="130" r="3" fill="#8B4A4A"/>
      <!-- leg bands -->
      <path d="M68,172 L84,172 M118,172 L134,172" stroke="#8B4A4A" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- mandala -->
  <g transform="translate(200,78)">
    <g>
      <use href="#petal"/>
      <use href="#petal" transform="rotate(30)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(210)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(330)"/>
    </g>
    <circle r="16" fill="none" stroke="#8B4A4A" stroke-width="2.5"/>
    <circle r="8" fill="#8B4A4A" opacity="0.55"/>
  </g>

  <!-- elephants facing each other -->
  <g transform="translate(10,80)">
    <use href="#elephant"/>
  </g>
  <g transform="translate(390,80) scale(-1,1)">
    <use href="#elephant"/>
  </g>
</svg>
